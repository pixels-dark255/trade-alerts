# Fixed sector list used by the AI tagger and the signup form
sectors:
  - Agri & Food
  - Chemicals & Pharma
  - Plastics & Packaging
  - Textiles & Apparel
  - Gems & Jewellery
  - Engineering & Metals
  - Electronics & IT Hardware
  - Leather & Footwear
  - Handicrafts & Home
  - Automobile & Parts
  - Energy & Minerals
  - Services & Procedures (all exporters)
