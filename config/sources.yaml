# Each source is scraped daily. type: html_table (generic table parser) or rss.
# Add more sources here — no code change needed for table-style government pages.
sources:
  - id: dgft_notification
    authority: DGFT
    kind: Notification
    type: html_table
    url: https://www.dgft.gov.in/CP/?opt=notification

  - id: dgft_public_notice
    authority: DGFT
    kind: Public Notice
    type: html_table
    url: https://www.dgft.gov.in/CP/?opt=public-notice

  - id: dgft_trade_notice
    authority: DGFT
    kind: Trade Notice
    type: html_table
    url: https://www.dgft.gov.in/CP/?opt=trade-notice

