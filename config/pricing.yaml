faq:
  - q: How accurate are the alerts?
    a: >-
      Each alert is written by AI from the official notice, and every alert links to that notice.
      We spot-check summaries against the PDFs. Mistakes can still happen, so always confirm with the
      official text before you act. If we find an error, we send a correction within one working day.
  - q: Is this legal or tax advice?
    a: >-
      No. Sagarlekh is an information service. For decisions about your shipments, licences or duties,
      read the official notice and consult your CA, customs broker or lawyer.
  - q: How does HS code matching work?
    a: >-
      You give us HS codes of 2 to 8 digits. A notice matches if it mentions the same code, a longer code
      under it, or its chapter. For example, 3923 matches notices about 392310 and notices about chapter 39.
      You can also pick a sector. Major procedural changes that affect all exporters go to everyone.
  - q: When do alerts arrive?
    a: >-
      We check DGFT every morning. Paid subscribers get their email the same day, usually by 1 pm IST.
      The free digest goes out once a week.
  - q: Which sources do you cover?
    a: >-
      Today: DGFT notifications, public notices and trade notices. CBIC Customs notifications and BIS
      Quality Control Orders are coming soon.
  - q: How do I upgrade, and when does it start?
    a: >-
      Pay using the button for your plan and enter the same email you subscribed with. Your plan is
      switched on within 24 hours. Plans do not renew automatically; you pay for each month or year.
  - q: Can I cancel or get a refund?
    a: >-
      You can stop at any time; your plan stays active until the end of the period you paid for.
      If you are not happy within 7 days of your first payment, email hello@dharalabs.in for a full refund.
  - q: What do you do with my data?
    a: >-
      We store only your email, company name, HS codes and sector to send your alerts. We never sell it.
      Payments are handled by Razorpay; we never see your card or bank details. Ask us any time to delete your data.

disclaimer: >-
  Sagarlekh is for information only and is not legal or tax advice. Always verify with the official notice.
